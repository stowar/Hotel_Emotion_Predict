<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒店评论智能情感分析系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        /* 标题+状态 */
        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #2c3e50;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .status-text {
            font-size: 14px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 15px;
            display: inline-block;
        }
        .status-ready { background: #e6f7f5; color: #4ECDC4; }
        .status-running { background: #fff4e5; color: #ff9f43; }
        .status-error { background: #fee; color: #FF6B6B; }

        /* 通用卡片 */
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .card h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 18px;
        }

        /* 单条预测区 */
        textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #e0e6ed;
            border-radius: 8px;
            resize: none;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #4ECDC4;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        .predict-btn { background-color: #4ECDC4; color: white; }
        .predict-btn:hover { background-color: #3dbdb6; }
        .predict-btn:disabled { background-color: #a5d8d5; cursor: not-allowed; }
        .clear-btn { background-color: #FF6B6B; color: white; }
        .clear-btn:hover { background-color: #e55a5a; }
        .history-btn { background-color: #95a5a6; color: white; }
        .history-btn:hover { background-color: #7f8c8d; }
        .batch-btn { background-color: #5f27cd; color: white; }
        .batch-btn:hover { background-color: #4d1fb9; }
        .batch-btn:disabled { background-color: #b0a0d8; cursor: not-allowed; }
        .export-btn { background-color: #00d2d3; color: white; }
        .export-btn:hover { background-color: #00b8bb; }
        .export-btn:disabled { background-color: #93e0e0; cursor: not-allowed; }

        /* 批量上传区域 */
        .batch-section {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .file-input {
            padding: 6px;
            border: 1px solid #e0e6ed;
            border-radius: 8px;
            width: 300px;
        }
        .file-name {
            color: #666;
            font-size: 14px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #eee;
            border-radius: 4px;
            margin: 10px 0;
            display: none;
        }
        .progress {
            height: 100%;
            background-color: #4ECDC4;
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* 结果区域 */
        .result-section { display: none; }
        .result-text {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            line-height: 1.6;
        }

        /* 图表区域 */
        .charts-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .chart-card {
            flex: 1;
            min-width: 500px;
        }
        .chart { height: 350px; }

        /* 批量结果表格 */
        .batch-result {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
            display: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th { background-color: #f8f9fa; color: #333; }
        .positive { color: #4ECDC4; font-weight: bold; }
        .negative { color: #FF6B6B; font-weight: bold; }

        /* 历史记录 */
        .history-list {
            max-height: 200px;
            overflow-y: auto;
            line-height: 1.8;
        }
        .history-empty {
            color: #999;
            text-align: center;
            padding: 20px 0;
        }
        .history-item {
            padding: 5px 0;
            border-bottom: 1px dashed #eee;
        }
        .label-toggle { cursor: pointer; font-weight:bold; font-size:16px; }
    </style>
</head>
<body>
<div class="header-section">
    <h1>酒店评论智能情感分析系统</h1>
    <div class="status-text status-ready" id="statusText">就绪</div>
</div>

<!-- 单条文本预测 -->
<div class="card">
    <textarea id="inputText" placeholder="请输入单条酒店评论进行预测..."></textarea>
    <div class="btn-group">
        <button class="predict-btn" onclick="predict()">单条预测</button>
        <button class="clear-btn" onclick="clearInput()">清空输入</button>
        <button class="history-btn" onclick="clearHistory()">清空历史记录</button>
    </div>
</div>

<!-- 批量文件预测 -->
<div class="card">
    <h3>批量评论预测（支持CSV/TSV）</h3>
    <div class="batch-section">
        <input type="file" id="fileInput" class="file-input" accept=".csv,.tsv" />
        <span class="file-name" id="fileName">未选择文件</span>
        <button class="batch-btn" onclick="batchPredict()">开始批量预测</button>
        <button class="export-btn" onclick="exportResult()" disabled id="exportBtn">导出预测结果</button>
    </div>
    <div class="progress-bar" id="progressBar">
        <div class="progress" id="progress"></div>
    </div>
    <div class="batch-result" id="batchResult">
        <table>
            <thead>
                <tr>
                    <th>评论内容</th>
                    <th>正面概率</th>
                    <th>负面概率</th>
                    <th>情感标签</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<!-- 单条预测结果 -->
<div class="card result-section" id="resultSection">
    <div class="result-text" id="resultText"></div>
</div>

<!-- 图表 -->
<div class="charts-section">
    <div class="card chart-card">
        <div class="chart" id="barChart"></div>
    </div>
    <div class="card chart-card">
        <div class="chart" id="heatChart"></div>
    </div>
</div>

<!-- 历史记录 -->
<div class="card">
    <h3>预测历史记录</h3>
    <div class="history-list" id="historyList">
        <div class="history-empty">暂无预测记录</div>
    </div>
</div>

<script>
    const barChart = echarts.init(document.getElementById('barChart'));
    const heatChart = echarts.init(document.getElementById('heatChart'));
    let batchResults = [];

    // 状态更新
    function updateStatus(text, status) {
        const el = document.getElementById('statusText');
        el.textContent = text;
        el.className = `status-text status-${status}`;
    }

    // 单条预测
    async function predict() {
        const text = document.getElementById('inputText').value.trim();
        const btn = document.querySelector('.predict-btn');
        if (!text) { updateStatus('请输入评论内容', 'error'); return; }

        btn.disabled = true; btn.textContent = "预测中...";
        updateStatus('单条预测中', 'running');
        try {
            const res = await fetch('http://127.0.0.1:8000/predict', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({text})
            });

            if(!res.ok) throw new Error('接口请求失败');
            const data = await res.json();

            showResult(data);
            drawCharts(data);
            saveToHistory(text, data.sentiment, data.pos_prob, data.neg_prob);
            updateStatus('单条预测完成', 'ready');
        } catch (e) {
            updateStatus('预测失败，请检查后端服务', 'error');
            alert('预测失败：请确认后端服务已启动！');
        } finally {
            btn.disabled = false;
            btn.textContent = "单条预测";
        }
    }

    // 显示单条结果
    function showResult(data) {
        const sec = document.getElementById('resultSection');
        sec.style.display = 'block';
        const color = data.sentiment === '正面好评' ? '#4ECDC4' : '#FF6B6B';
        document.getElementById('resultText').innerHTML =
            `【预测结果】<span style="color:${color}">${data.sentiment}</span><br>
             正面概率：${(data.pos_prob*100).toFixed(2)}% | 负面概率：${(data.neg_prob*100).toFixed(2)}%`;
    }

    // 绘制图表（已修复数值错误+优化样式）
    function drawCharts(data) {
        // 概率柱状图
        barChart.setOption({
            title: {text:'情感概率分布', left: 'center'},
            tooltip: {trigger: 'axis'},
            xAxis: {data: ['负面', '正面'], axisLabel: {fontSize: 14}},
            yAxis: {show: false},
            series: [{
                type: 'bar',
                data: [
                    {value: data.neg_prob, itemStyle: {color: '#FF6B6B'}},
                    {value: data.pos_prob, itemStyle: {color: '#4ECDC4'}}
                ],
                label: {
                    show: true,
                    position: 'top',
                    formatter: (params) => (params.value * 100).toFixed(2) + '%'
                }
            }]
        });

        // 注意力热力图（优化版）
        heatChart.setOption({
            title: {text: '词汇注意力权重', left: 'center'},
            tooltip: {formatter: '词汇：{b}<br/>权重：{c}'},
            grid: {height: '80%', top: '10%', right: '15%', left: '10%'},
            xAxis: {
                type: 'category',
                data: data.words,
                axisLabel: {interval: 0}
            },
            yAxis: {
                type: 'category',
                data: ['注意力值']
            },
            visualMap: {
                min: 0,
                max: 1, // 固定范围，保证渐变自然
                calculable: true,
                orient: 'vertical', // 🔥 图例改成垂直方向
                right: '5%', // 🔥 图例移到右边
                top: 'center', // 垂直居中
                inRange: {
                    // 柔和淡红渐变（浅→深，和热力图颜色对应）
                    color: ['#fff0f0', '#ff8a80', '#f44336']
                }
            },
            series: [{
                type: 'heatmap',
                data: data.words.map((_, i) => [i, 0, data.attn_weights[i].toFixed(4)]),
                label: {show: true},
                emphasis: {itemStyle: {shadowBlur: 10}}
            }]
        });
    }

    // 清空输入
    function clearInput() {
        document.getElementById('inputText').value = '';
        document.getElementById('resultSection').style.display = 'none';
        barChart.clear();
        heatChart.clear();
        updateStatus('就绪', 'ready');
    }

    // 文件选择监听
    document.getElementById('fileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        document.getElementById('fileName').textContent = file ? file.name : '未选择文件';
        document.getElementById('exportBtn').disabled = true;
        batchResults = [];
    });

    // 解析CSV/TSV
    function parseFile(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result;
                const delimiter = file.name.endsWith('.tsv') ? '\t' : ',';
                const rows = text.split('\n').filter(i => i.trim());
                const texts = [];
                rows.forEach(row => {
                    const cols = row.split(delimiter);
                    const val = cols.find(c => /[\u4e00-\u9fa5]/.test(c)) || cols[0];
                    if (val.trim()) texts.push(val.trim());
                });
                resolve(texts);
            };
            reader.readAsText(file, 'UTF-8');
        });
    }

    // 批量预测（添加延迟，防止后端卡顿）
    async function batchPredict() {
        const file = document.getElementById('fileInput').files[0];
        if (!file) { alert('请选择CSV/TSV文件'); return; }

        const btn = document.querySelector('.batch-btn');
        const bar = document.getElementById('progressBar');
        const prog = document.getElementById('progress');
        btn.disabled = true; bar.style.display = 'block';
        updateStatus('正在解析文件...', 'running');

        const texts = await parseFile(file);
        batchResults = [];
        updateStatus(`开始批量预测，共${texts.length}条`, 'running');

        for (let i = 0; i < texts.length; i++) {
            const text = texts[i];
            try {
                const res = await fetch('http://127.0.0.1:8000/predict', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({text})
                });
                const data = await res.json();
                batchResults.push({
                    text, pos:data.pos_prob, neg:data.neg_prob, sent:data.sentiment
                });
            } catch (e) {
                batchResults.push({text, pos:0, neg:0, sent:'预测失败'});
            }
            prog.style.width = `${((i+1)/texts.length)*100}%`;
            await new Promise(resolve => setTimeout(resolve, 80)); // 防并发
        }

        renderBatchResult();
        document.getElementById('exportBtn').disabled = false;
        bar.style.display = 'none';
        btn.disabled = false;
        updateStatus(`批量预测完成，共${batchResults.length}条`, 'ready');
    }

    // 渲染批量结果
    function renderBatchResult() {
        const body = document.getElementById('resultBody');
        const sec = document.getElementById('batchResult');
        sec.style.display = 'block';
        body.innerHTML = '';

        batchResults.forEach((item, index) => {
            // 1. 转换为 0/1 标签
            const label = item.sent === '正面好评' ? 1 : 0;
            // 2. 低置信度判断（<70% 标黄提醒人工检查）
            const isLowConf = Math.max(item.pos, item.neg) < 0.7;
            const rowClass = isLowConf ? 'background:#fff3cd;' : ''; // 标黄

            body.innerHTML += `
            <tr style="${rowClass}">
                <td>${item.text}</td>
                <td>${(item.pos*100).toFixed(2)}%</td>
                <td>${(item.neg*100).toFixed(2)}%</td>
                <!-- 点击数字切换标签 → 核心半自动标注功能 -->
                <td class="label-toggle" onclick="toggleLabel(${index})">
                    ${label}
                </td>
            </tr>`;
        });
    }

    // 在线切换 0/1 标签（人工修正）
    function toggleLabel(index) {
        const item = batchResults[index];
        if (item.sent === '正面好评') {
            item.sent = '负面差评';
        } else {
            item.sent = '正面好评';
        }
        // 重新渲染表格
        renderBatchResult();
    }

    // 导出CSV（修复Excel乱码）
    function exportResult() {
        const BOM = '\uFEFF'; // 防止Excel乱码
        // 核心：评论\t数字格式（1=正面，0=负面）
        const rows = batchResults.map(item => {
            const label = item.sent === '正面好评' ? 1 : 0;
            return `${item.text}\t${label}`;
        });
        // 拼接内容，无表头
        const result = BOM + rows.join('\n');
        // 导出为TSV格式（制表符分隔标准格式）
        const blob = new Blob([result], {type:'text/tab-separated-values;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `评论标注结果_${new Date().toLocaleDateString()}.tsv`;
        a.click();
        URL.revokeObjectURL(url);
    }

    // 历史记录
    function saveToHistory(text, sent, pos, neg) {
        let hist = JSON.parse(localStorage.getItem('hist')||'[]');
        hist.unshift({text,sent,pos,neg,time:new Date().toLocaleString()});
        localStorage.setItem('hist', JSON.stringify(hist.slice(0,20)));
        renderHist();
    }
    function renderHist() {
        const hist = JSON.parse(localStorage.getItem('hist')||'[]');
        const el = document.getElementById('historyList');
        el.innerHTML = hist.length ? hist.map(i => `
            <div class="history-item">▶ ${i.text} | <span class="${i.sent==='正面好评'?'positive':'negative'}">${i.sent}</span></div>
        `).join('') : '<div class="history-empty">暂无预测记录</div>';
    }
    function clearHistory() {
        if (confirm('确定要清空所有历史记录吗？')) {
            localStorage.removeItem('hist');
            renderHist();
        }
    }

    // 图表自适应
    window.addEventListener('resize', () => {
        barChart.resize();
        heatChart.resize();
    });
    window.onload = renderHist;
</script>
</body>
</html>
